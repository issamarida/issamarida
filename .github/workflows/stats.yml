name: stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 assets/stats.py ${{ github.repository_owner }} > assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "Issam Arida"
          git config user.email "145283121+issamarida@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
