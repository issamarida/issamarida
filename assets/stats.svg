.area{fill:url(#fade)}.trend{fill:none;stroke:var(--green);stroke-width:1.6;stroke-linejoin:round}
.s0{stop-color:var(--green);stop-opacity:.85}.s1{stop-color:var(--green);stop-opacity:.35}
