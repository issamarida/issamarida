text{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
.m{font-size:10px;letter-spacing:.12em;fill:var(--pen)}.b{font-size:20px}.lg{font-size:14px}.dim{opacity:.55}
